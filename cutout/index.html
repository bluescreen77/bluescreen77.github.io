<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>누끼 키트 · 블루스크린 AI</title>
<meta name="description" content="누끼 키트는 인스타그램 DM으로 무료로 보내 드려요.">
<link rel="icon" href="/edit/img/icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="/nav.css">
<style>
:root{--mist:#f5f5f7;--ink:#1d1d1f;--mute:#6e6e73;--blue:#0078d7;--deep:#0063b1;--sky:#e3effa}
*{box-sizing:border-box;margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#fff;
  font-size:17px;line-height:1.55;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.gate{max-width:1000px;margin:56px auto 0;padding:0 22px}
.box{background:var(--mist);border-radius:34px;display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:end;overflow:hidden}
.box .t{padding:clamp(32px,5vw,64px);padding-right:0}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--blue);background:var(--sky);padding:4px 10px;border-radius:999px}
h1{font-size:clamp(32px,4.6vw,52px);line-height:1.12;letter-spacing:-.04em;margin-top:16px}
.lead{color:var(--mute);font-size:clamp(17px,1.9vw,20px);margin-top:14px;line-height:1.5}
ol{list-style:none;padding:0;margin:28px 0 32px;display:grid;gap:14px}
ol li{display:flex;gap:14px;align-items:center;font-size:17px}
ol li span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
ol code{font-family:inherit;font-weight:700;background:#fff;padding:1px 8px;border-radius:6px}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:560;padding:12px 24px;border-radius:999px}
.btn:hover{background:var(--deep)}
.btn.line{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 1px #c9dcf0}
.pose{position:relative;display:block;margin-right:clamp(16px,4vw,40px)}
.pose::before{content:"";position:absolute;left:6%;right:6%;bottom:0;aspect-ratio:1;border-radius:50%;background:#e8e8ed}
.pose img{position:relative}
.small{color:var(--mute);font-size:14px;text-align:center;margin:28px 22px 80px}
@media (max-width:760px){
  .gate{margin-top:32px}
  .box{grid-template-columns:1fr;gap:0;border-radius:26px}
  .box .t{padding:32px 24px 0}
  h1{font-size:32px}
  ol li{font-size:15px;gap:10px}
  .btn{padding:11px 18px;font-size:16px}
  .pose{width:52%;justify-self:end;margin:12px 12px 0 0}
}
</style>
</head>
<body>
<nav class="gnav" aria-label="사이트">
  <div class="in">
    <a class="logo" href="/"><i></i>블루스크린 AI</a>
    <div class="links" id="gl">
      <a href="/#kits">스타터팩</a>
      <a href="/#how">받는 법</a>
      <a class="m-cta" href="https://www.instagram.com/bluescreen.ai/" rel="noopener">인스타그램 팔로우</a>
    </div>
    <a class="cta" href="https://www.instagram.com/bluescreen.ai/" rel="noopener">팔로우</a>
    <button class="menu" type="button" aria-expanded="false" aria-controls="gl" aria-label="메뉴 열기"><span></span></button>
  </div>
</nav>
<main class="gate">
  <div class="box">
    <div class="t">
      <span class="tag">무료</span>
      <h1>누끼 키트는<br>DM으로 보내 드려요</h1>
      <p class="lead">HTML 파일 하나,<br>더블클릭하면 배경이 지워져요.</p>
      <ol>
        <li><span>1</span>@bluescreen.ai 팔로우</li>
        <li><span>2</span>DM으로 <code>누끼</code> 보내기</li>
        <li><span>3</span>답장으로 온 링크 열기</li>
      </ol>
      <div class="btns">
        <a class="btn" href="https://ig.me/m/bluescreen.ai" rel="noopener">DM 보내기</a>
        <a class="btn line" href="https://www.instagram.com/bluescreen.ai/" rel="noopener">팔로우</a>
      </div>
    </div>
    <span class="pose"><img src="/img/phone.webp" alt="휴대폰을 보여 주는 블루스크린 캐릭터" width="322" height="420"></span>
  </div>
  <p class="small">DM 답장이 안 보이면 메시지 요청함을 확인해 주세요.</p>
</main>
<script>
(() => { const n = document.querySelector('.gnav'), b = n.querySelector('.menu');
  b.addEventListener('click', () => { const o = n.classList.toggle('open'); b.setAttribute('aria-expanded', o); b.setAttribute('aria-label', o ? '메뉴 닫기' : '메뉴 열기'); });
  n.querySelectorAll('.links a').forEach(a => a.addEventListener('click', () => { n.classList.remove('open'); b.setAttribute('aria-expanded', false); }));
})();
</script>
</body>
</html>
